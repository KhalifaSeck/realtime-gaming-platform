global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: "rtgaming"

scrape_configs:
  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # FastAPI /metrics
  - job_name: "rtgaming-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: "api"
          env: "dev"