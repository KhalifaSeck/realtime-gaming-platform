# ==============================================================================
# Airflow on AKS - Helm values
# Executor: KubernetesExecutor (1 pod per task, cloud-native)
# ==============================================================================

executor: "KubernetesExecutor"

# ---------- Fernet key for encrypting connections/variables ----------
# Générée avec: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
fernetKey: "z8vY7YRP6C7JQtF4TfxN2NRvIGuVWqDkG0mMhXpS0jU="

# ---------- Post-install / migration jobs ----------
migrateDatabaseJob:
  useHelmHooks: true
  applyCustomEnv: false

createUserJob:
  useHelmHooks: false
  applyCustomEnv: false

# ---------- PostgreSQL embarqué ----------
postgresql:
  enabled: true
  auth:
    enablePostgresUser: true
    postgresPassword: "airflow2026"
  primary:
    persistence:
      enabled: true
      size: 8Gi
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1
        memory: 1Gi

# ---------- Redis désactivé (KubernetesExecutor n'en a pas besoin) ----------
redis:
  enabled: false

# ---------- Webserver ----------
webserver:
  replicas: 1
  service:
    type: LoadBalancer
    ports:
      - name: airflow-ui
        port: 8080
        targetPort: 8080
  defaultUser:
    enabled: false
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 800m
      memory: 1Gi
  livenessProbe:
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 20
    failureThreshold: 10
  readinessProbe:
    initialDelaySeconds: 30
    periodSeconds: 15
    timeoutSeconds: 20
    failureThreshold: 10
  startupProbe:
    failureThreshold: 30
    periodSeconds: 15
    timeoutSeconds: 20

# ---------- Scheduler ----------
scheduler:
  replicas: 1
  resources:
    requests:
      cpu: 300m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 1Gi
  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 60
    timeoutSeconds: 20
    failureThreshold: 5
  logGroomerSidecar:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi

# ---------- Triggerer ----------
triggerer:
  replicas: 1
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ---------- Image Airflow ----------
images:
  airflow:
    repository: apache/airflow
    tag: 2.10.4
    pullPolicy: IfNotPresent
  useDefaultImageForMigration: false

# ---------- Workers (Kubernetes pod par task) ----------
workers:
  resources:
    requests:
      cpu: 300m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 1Gi

# ---------- Statsd désactivé ----------
statsd:
  enabled: false

# ---------- Ingress désactivé (on utilise LoadBalancer directement) ----------
ingress:
  web:
    enabled: false

# ---------- DAGs via git-sync ----------
dags:
  gitSync:
    enabled: true
    repo: "https://github.com/KhalifaSeck/realtime-gaming-platform.git"
    branch: main
    subPath: airflow/dags
    depth: 1
    wait: 30
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

# ---------- Airflow config ----------
config:
  core:
    load_examples: "False"
    dags_are_paused_at_creation: "True"
    executor: "KubernetesExecutor"
  webserver:
    expose_config: "True"
    dag_default_view: "grid"
  logging:
    remote_logging: "False"
    logging_level: "INFO"
  scheduler:
    dag_dir_list_interval: "60"
    catchup_by_default: "False"
  kubernetes_executor:
    namespace: "airflow"
    worker_container_repository: "apache/airflow"
    worker_container_tag: "2.10.4"
    delete_worker_pods: "True"
    delete_worker_pods_on_failure: "False"