# ============================================================
# Real-time gaming platform - services locaux (dev)
#
# Kafka en mode KRaft (sans Zookeeper), image officielle Apache.
#
# Services :
#   - kafka       : Apache Kafka 3.9 KRaft (broker + controller combines)
#   - kafka-init  : job one-shot qui cree les 4 topics
#   - kafka-ui    : UI web (http://localhost:8080)
#   - redis       : cache live state (Brique 5)
#
# Ports host :
#   - Kafka       : localhost:9092
#   - Kafka-UI    : http://localhost:8080
#   - Redis       : localhost:6379
# ============================================================

services:

  # ── Kafka (KRaft) ─────────────────────────────────────────────────────────
  kafka:
    image: apache/kafka:3.9.0
    container_name: rtg_kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      # --- Identite du node ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      # --- Listeners ---
      # PLAINTEXT     : entre containers (kafka:29092)
      # CONTROLLER    : quorum KRaft (interne)
      # PLAINTEXT_HOST: depuis le laptop (localhost:9092)
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # --- Dev-friendly defaults (single-node) ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - rtg_network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ── Topic bootstrap (job one-shot) ────────────────────────────────────────
  kafka-init:
    image: apache/kafka:3.9.0
    container_name: rtg_kafka_init
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - rtg_network
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        for topic in purchases reviews sessions wishlist; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 \
            --create --if-not-exists \
            --topic $$topic \
            --partitions 3 --replication-factor 1
        done
        echo "Topics created :"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list

  # ── Kafka UI ──────────────────────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: rtg_kafka_ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: rtg-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    ports:
      - "8081:8080"
    networks:
      - rtg_network

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: rtg_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - rtg_redis_data:/data
    networks:
      - rtg_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    
      # ── Neo4j Knowledge Graph ─────────────────────────────────────────────────
  neo4j:
    image: neo4j:5.18
    container_name: rtg_neo4j
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=neo4j/rtgaming2026
      - NEO4J_PLUGINS=["apoc","graph-data-science"]
      - NEO4J_dbms_memory_heap_max__size=512m
      - NEO4J_dbms_memory_pagecache_size=256m
    ports:
      - "7474:7474"    # HTTP browser
      - "7687:7687"    # Bolt (drivers)
    volumes:
      - rtg_neo4j_data:/data
    networks:
      - rtg_network
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null -q http://localhost:7474 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
  

  # ── FastAPI ────────────────────────────────────────────────────────────────
  api:
    build: ./api
    image: rtgaming-api:dev
    container_name: rtg_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Overrides pour utiliser les noms de containers (au lieu de localhost)
      REDIS_HOST: redis
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: rtgaming2026
      # Snowflake vars proviennent de api/.env (loaded automatiquement)
    env_file:
      - ./api/.env
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - rtg_network
  

    # ── Prometheus ─────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: rtg_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - rtg_prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    networks:
      - rtg_network
    depends_on:
      - api

  # ── Grafana ───────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: rtg_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: rtgaming
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - rtg_grafana_data:/var/lib/grafana
    networks:
      - rtg_network
    depends_on:
      - prometheus
      
networks:
  rtg_network:
    driver: bridge

volumes:
  rtg_redis_data:
  rtg_neo4j_data:
  rtg_prometheus_data:
  rtg_grafana_data: